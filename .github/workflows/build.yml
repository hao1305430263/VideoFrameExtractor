name: Build and Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: write

env:
  VCPKG_ROOT: 'C:\vcpkg'

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Cache vcpkg packages
      uses: actions/cache@v4
      with:
        path: build/vcpkg_installed
        key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json','vcpkg-configuration.json') }}-v1
        restore-keys: |
          vcpkg-${{ runner.os }}-

    - name: Configure CMake
      run: cmake --preset vcpkg

    - name: Build (Release)
      run: cmake --build build --config Release

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: VideoFrameExtractor
        path: build/Release/video_frame_extractor.exe

    - name: Create GitHub Release
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v2
      with:
        files: build/Release/video_frame_extractor.exe
        generate_release_notes: true
